sessions: 50
seed: 42

# Tỷ giá bán ra USD/VND niêm yết tại Vietcombank (xem ngày 27/11/2026)
usd_to_vnd:
  rate: 26030
  source: "https://www.vietcombank.com.vn/ (xem ngày 27/11/2026)"

# Tổng số người dùng gặp giao dịch bị giữ và nhắn hỗ trợ / tháng (3 kịch bản)
users:
  low: 50000
  base: 112000
  high: 215000
  source: "Giả định của nhóm. Dựa trên 50 triệu người dùng ví tại VN, ước tính tỷ lệ gặp giao dịch bị giữ cần hỗ trợ là 0.1% - 0.4% / tháng (tự ước tính)."

# Bảng giá model (dạng danh sách)
prices:
  - model: "gemini-3.1-flash-lite"
    input: 0.25   # USD / 1M tokens
    output: 1.50  # USD / 1M tokens
    source: "Bảng giá BTC cung cấp, ngày 25/11/2026"

  - model: "gemini-3.8-flash"
    input: 1.50   # USD / 1M tokens
    output: 7.50  # USD / 1M tokens
    source: "Bảng giá BTC cung cấp, ngày 25/11/2026"

# Danh sách Persona (dạng danh sách có dấu gạch ngang '-', có trường share)
personas:
  - name: "nguoi_lon_tuoi_bi_giuc"
    share: 0.35             # Chiếm 35% tổng số phiên
    uses_per_month: 1.2     # Trung bình bị giữ và liên hệ 1.2 lần/tháng
    turns_per_session: 5    # Phản hồi nhiều lượt vì hoang mang và tranh luận
    human_handoff_rate: 0.85
    source: "Giả định của nhóm. Kịch bản lấy từ phỏng vấn P1–P6 (mẫu nhỏ), chưa có số liệu thống kê chính thức."

  - name: "chu_shop_nho_gap_that"
    share: 0.50             # Chiếm 50% tổng số phiên
    uses_per_month: 3.2     # Tần suất thanh toán và bị quét nhầm cao (3-4 lần/tháng)
    turns_per_session: 2    # Giải thích ngắn gọn, cung cấp thông tin là xong
    human_handoff_rate: 0.25
    source: "Giả định của nhóm, tham khảo phỏng vấn P1–P6 (mẫu nhỏ). Chưa có nguồn cho số người dùng và tỉ lệ quét nhầm."

  - name: "nguoi_bi_chiem_tai_khoan"
    share: 0.15             # Chiếm 15% tổng số phiên
    uses_per_month: 1.0     # Thường là sự cố đột xuất 1 lần
    turns_per_session: 3    # Báo cáo sự cố và yêu cầu khóa tài khoản khẩn cấp
    human_handoff_rate: 0.95
    source: "Giả định của nhóm, tham khảo phỏng vấn P1–P6 (mẫu nhỏ). Chưa có nguồn cho số người dùng."