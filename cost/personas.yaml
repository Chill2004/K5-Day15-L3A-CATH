# ==============================================================================
# BẢNG THIẾT LẬP MÔ PHỎNG CHI PHÍ & PERSONA NGƯỜI DÙNG (CATH Track E3)
# ==============================================================================

# Tỷ giá bán ra USD/VND niêm yết chính thức tại Vietcombank (xem ngày 27/11/2026)
# Nguồn: https://www.vietcombank.com.vn/
usd_to_vnd: 26030

prices:
  # Bảng giá chính thức của Google Gemini API cho gói trả phí (Pay-as-you-go)
  # Nguồn: bảng giá BTC cung cấp, ngày 25/11/2026
  gemini-3.1-flash-lite:
    input: 0.25   # USD / 1M tokens (cho prompt <= 128k)
    output: 1.50  # USD / 1M tokens
    source: "Bảng giá BTC cung cấp, ngày 25/11/2026"

  gemini-3.8-flash:
    input: 1.50   # USD / 1M tokens (cho prompt <= 128k)
    output: 7.50  # USD / 1M tokens
    source: "Bảng giá BTC cung cấp, ngày 25/11/2026"
    # Giá áp dụng từ 01/01/2027

personas:
  nguoi_lon_tuoi_bi_giuc:
    name: "Người lớn tuổi bị giục chuyển tiền"
    description: "Người dùng bị kẻ xấu thao túng tâm lý (giả công an, viện phí tai nạn, trúng thưởng tri ân, nhiệm vụ tài chính). Nạn nhân hoảng loạn, tin rằng mình gấp thật, thúc ép hỗ trợ mở chặn và dễ tranh cãi khi bị từ chối."
    users:
      low: 15000
      base: 35000
      high: 70000
    uses_per_month: 1.2     # Trung bình bị giữ và liên hệ 1.2 lần/tháng
    turns_per_session: 5.5  # Phản hồi nhiều lượt vì hoang mang và tranh luận với bot
    human_handoff_rate: 0.85 # 85% trường hợp cần chuyển tư vấn viên can thiệp trực tiếp
    source: "Giả định của nhóm. Kịch bản lấy từ phỏng vấn P1–P6 (mẫu nhỏ), chưa có số liệu thống kê chính thức."
    types:
      - "bi_giuc"

  chu_shop_nho_gap_that:
    name: "Chủ shop nhỏ gấp thật"
    description: "Chủ hộ kinh doanh, tiểu thương, cá nhân thanh toán tiền hàng quen, học phí, tiền cọc, viện phí thật. Giao dịch gấp gáp nhưng thông tin người nhận rõ ràng, mạch lạc, có lịch sử giao dịch trước đó."
    users:
      low: 30000
      base: 65000
      high: 120000
    uses_per_month: 3.2     # Tần suất thanh toán và bị quét nhầm cao (3-4 lần/tháng)
    turns_per_session: 2.5  # Giải thích lý do ngắn gọn, cung cấp thông tin là xong
    human_handoff_rate: 0.25 # 25% ca chuyển tư vấn viên; 75% còn lại AI gửi xác thực cho người dùng, tư vấn viên duyệt, AI không tự mở
    source: "Giả định của nhóm, tham khảo phỏng vấn P1–P6 (mẫu nhỏ). Chưa có nguồn cho số người dùng và tỉ lệ quét nhầm."
    types:
      - "gap_that"

  nguoi_bi_chiem_tai_khoan:
    name: "Người bị chiếm tài khoản"
    description: "Khách hàng phát hiện tài khoản bị hack, mất điện thoại, click link lừa đảo bị chiếm quyền hoặc bị trừ tiền lạ. Tâm lý hoảng sợ, mục tiêu duy nhất là khóa ví và thu hồi tiền ngay lập tức."
    users:
      low: 5000
      base: 12000
      high: 25000
    uses_per_month: 1.0     # Thường là sự cố đột xuất 1 lần
    turns_per_session: 3.0  # Báo cáo sự cố và yêu cầu khóa tài khoản khẩn cấp
    human_handoff_rate: 0.95 # 95% chuyển ngay cho đội ngũ chuyên viên Fraud/Security để đóng băng tài khoản
    source: "Giả định của nhóm, tham khảo phỏng vấn P1–P6 (mẫu nhỏ). Chưa có nguồn cho số người dùng."
    types:
      - "chiem_tk"
